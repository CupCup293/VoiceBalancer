name: Publish VoiceBalance 1.0.1

on:
  push:
    branches: [main]
    paths: [.github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: voicebalance-v1.0.1

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Test and package the release
        run: |
          git clone --no-checkout "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" source
          git -C source checkout --detach "$GITHUB_SHA"
          node --test source/tests/processor.test.cjs
          git -C source archive --format=zip --output="$PWD/VoiceBalance-1.0.1.zip" "$GITHUB_SHA" README.md LICENSE voiceBalance.web
      - name: Publish v1.0.1
        run: |
          if gh release view v1.0.1 >/dev/null 2>&1; then
            exit 0
          fi
          gh release create v1.0.1 VoiceBalance-1.0.1.zip \
            --target "$GITHUB_SHA" --title "VoiceBalance 1.0.1" --latest --notes-file - <<'NOTES'
          Обновление баланса громкости для Vesktop и Vencord в браузере.

          - Пики на границе аудиоблоков приглушаются плавнее.
          - Тихая речь быстрее восстанавливает громкость после короткого громкого звука.
          - При замене дорожки сохраняется общий аудиоконтекст.
          NOTES
